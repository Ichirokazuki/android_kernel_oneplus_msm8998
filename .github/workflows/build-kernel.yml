name: Build OnePlus 5T (dumpling) Kernel - KernelSU Next + SUSFS + Meta OverlayFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Git Repository URL'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_msm8998'
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-21'
      kernel_defconfig:
        description: 'Defconfig name'
        required: true
        default: 'lineageos_dumpling_defconfig'
      enable_ksu_next:
        description: 'Integrate KernelSU-Next'
        required: true
        type: boolean
        default: true
      enable_susfs:
        description: 'Integrate SUSFS (susfs4ksu)'
        required: true
        type: boolean
        default: true
      enable_gaming_tweaks:
        description: 'Apply Gaming & Daily Usage Performance Tweaks'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "DEVICE=dumpling" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            zip \
            curl \
            wget \
            python3 \
            libncurses5 \
            ccache \
            patch

      - name: Download Proton Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/toolchain/clang

      - name: Clone Kernel Source
        run: |
          REPO_URL="${{ github.event.inputs.kernel_repo }}"
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          [ -z "$REPO_URL" ] && REPO_URL="https://github.com/LineageOS/android_kernel_oneplus_msm8998"
          [ -z "$BRANCH" ] && BRANCH="lineage-21"
          echo "Cloning $REPO_URL ($BRANCH)..."
          git clone --depth=1 -b "$BRANCH" "$REPO_URL" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next
        if: ${{ github.event_name == 'push' || github.event.inputs.enable_ksu_next == 'true' || github.event.inputs.enable_ksu_next == true }}
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo "=== Integrating KernelSU-Next ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Integrate SUSFS (susfs4ksu) & Meta OverlayFS Patches
        if: ${{ github.event_name == 'push' || github.event.inputs.enable_susfs == 'true' || github.event.inputs.enable_susfs == true }}
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== Cloning SUSFS for 4.4 Kernel ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.4 susfs_src || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src

          # Copy SUSFS core kernel files
          if [ -d "$GITHUB_WORKSPACE/susfs_src/kernel_patches" ]; then
            cp -r $GITHUB_WORKSPACE/susfs_src/kernel_patches/fs/* $GITHUB_WORKSPACE/kernel/fs/ || true
            cp -r $GITHUB_WORKSPACE/susfs_src/kernel_patches/include/linux/* $GITHUB_WORKSPACE/kernel/include/linux/ || true

            cd $GITHUB_WORKSPACE/kernel
            # Apply SUSFS patch to kernel source if patch exists
            SUSFS_KERNEL_PATCH=$(find $GITHUB_WORKSPACE/susfs_src/kernel_patches -name "*50_add_susfs_in_kernel*.patch" | head -n 1)
            if [ -n "$SUSFS_KERNEL_PATCH" ] && [ -f "$SUSFS_KERNEL_PATCH" ]; then
              echo "Applying kernel patch: $SUSFS_KERNEL_PATCH"
              patch -p1 -N -s < "$SUSFS_KERNEL_PATCH" || echo "Note: Some patch hunks were already present or skipped."
            fi

            # Apply SUSFS patch to KernelSU if patch exists
            if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU" ] || [ -d "$GITHUB_WORKSPACE/kernel/drivers/kernelsu" ]; then
              KSU_DIR="$GITHUB_WORKSPACE/kernel/KernelSU"
              [ ! -d "$KSU_DIR" ] && KSU_DIR="$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
              SUSFS_KSU_PATCH=$(find $GITHUB_WORKSPACE/susfs_src/kernel_patches -name "*10_enable_susfs_for_ksu*.patch" | head -n 1)
              if [ -n "$SUSFS_KSU_PATCH" ] && [ -f "$SUSFS_KSU_PATCH" ]; then
                echo "Applying KSU patch: $SUSFS_KSU_PATCH"
                cd "$KSU_DIR"
                patch -p1 -N -s < "$SUSFS_KSU_PATCH" || echo "Note: KSU patch hunks already present or skipped."
                cd $GITHUB_WORKSPACE/kernel
              fi
            fi
          fi

      - name: Apply Defconfig Tweaks (KernelSU, SUSFS, Meta OverlayFS, Gaming & Daily Usage)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          DEFCONFIG="${{ github.event.inputs.kernel_defconfig }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="lineageos_dumpling_defconfig"

          TARGET_CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          if [ ! -f "$TARGET_CONFIG_PATH" ]; then
            if [ -f "arch/arm64/configs/msm8998_defconfig" ]; then
              TARGET_CONFIG_PATH="arch/arm64/configs/msm8998_defconfig"
              DEFCONFIG="msm8998_defconfig"
            fi
          fi

          echo "Configuring: $TARGET_CONFIG_PATH"

          # 1. KernelSU & Kprobes
          cat << 'EOF' >> "$TARGET_CONFIG_PATH"

# KernelSU-Next Configuration
CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y

# SUSFS (susfs4ksu) Configuration
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=n
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y

# Meta OverlayFS Support
CONFIG_OVERLAY_FS=y
CONFIG_OVERLAY_FS_REDIRECT_DIR=y
CONFIG_OVERLAY_FS_INDEX=y
CONFIG_OVERLAY_FS_XINO_AUTO=y
CONFIG_OVERLAY_FS_METACOPY=y
EOF

          # 2. Gaming & Daily Usage Performance Tweaks
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event.inputs.enable_gaming_tweaks }}" == "true" ] || [ "${{ github.event.inputs.enable_gaming_tweaks }}" == true ]; then
            cat << 'EOF' >> "$TARGET_CONFIG_PATH"

# Gaming & Daily Usage Performance & Latency Optimizations
CONFIG_TCP_CONG_ADVANCED=y
CONFIG_TCP_CONG_BBR=y
CONFIG_DEFAULT_TCP_CONG="bbr"
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_HZ_300=y
CONFIG_HZ=300
CONFIG_PREEMPT=y
CONFIG_ZRAM=y
CONFIG_ZRAM_WRITEBACK=y
CONFIG_ZSMALLOC=y
CONFIG_CRYPTO_LZ4=y
CONFIG_CRYPTO_ZSTD=y

# Reduce Debug Overhead for Frame-Rate Consistency & Battery
CONFIG_DEBUG_PREEMPT=n
CONFIG_DEBUG_SPINLOCK=n
CONFIG_DEBUG_MUTEXES=n
CONFIG_LOCKUP_DETECTOR=n
CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=n
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=n
CONFIG_DETECT_HUNG_TASK=n
EOF
          fi

          # Pure / Original Naming: Ensure no custom string branding
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' "$TARGET_CONFIG_PATH" || true
          echo 'CONFIG_LOCALVERSION=""' >> "$TARGET_CONFIG_PATH"

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="buildhost"

          DEFCONFIG="${{ github.event.inputs.kernel_defconfig }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="lineageos_dumpling_defconfig"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            DEFCONFIG="msm8998_defconfig"
          fi

          echo "Generating configuration using $DEFCONFIG..."
          make O=out ARCH=arm64 "$DEFCONFIG"

          echo "Compiling kernel..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/anykernel
          if [ -f "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" ]; then
            cp "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" "$GITHUB_WORKSPACE/anykernel/anykernel.sh"
          fi

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_OUT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          
          if [ -f "$KERNEL_OUT/Image.gz-dtb" ]; then
            cp "$KERNEL_OUT/Image.gz-dtb" $GITHUB_WORKSPACE/anykernel/
          elif [ -f "$KERNEL_OUT/Image.gz" ]; then
            cp "$KERNEL_OUT/Image.gz" $GITHUB_WORKSPACE/anykernel/
            if [ -f "$KERNEL_OUT/dtb.img" ]; then
              cp "$KERNEL_OUT/dtb.img" $GITHUB_WORKSPACE/anykernel/
            fi
          elif [ -f "$KERNEL_OUT/Image" ]; then
            cp "$KERNEL_OUT/Image" $GITHUB_WORKSPACE/anykernel/
          else
            echo "Error: Compiled kernel image not found!"
            exit 1
          fi

          cd $GITHUB_WORKSPACE/anykernel
          ZIP_NAME="kernel-dumpling-${{ env.BUILD_TIME }}.zip"
          zip -r9 "$ZIP_NAME" * -x .git .github README.md *placeholder
          echo "ZIP_PATH=$GITHUB_WORKSPACE/anykernel/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
