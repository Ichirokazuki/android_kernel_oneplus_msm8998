name: Build OnePlus 5T (dumpling) Kernel - KernelSU Next + SUSFS + Meta OverlayFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Git Repository URL'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_msm8998'
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-21'
      kernel_defconfig:
        description: 'Defconfig name'
        required: true
        default: 'lineage_oneplus5_defconfig'
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_oneplus_msm8998' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-21' }}
  DEFCONFIG_INPUT: ${{ github.event.inputs.kernel_defconfig || 'lineage_oneplus5_defconfig' }}

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Build Timestamp
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "DEVICE=dumpling" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            zip \
            patch \
            mkbootimg \
            cpio

      - name: Download Proton Clang Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          echo "Cloning Proton Clang (self-contained toolchain)..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/toolchain/clang"

      - name: Clone Kernel Source
        run: |
          echo "Cloning $KERNEL_REPO ($KERNEL_BRANCH)..."
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

      - name: Integrate KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          echo "=== Integrating KernelSU-Next ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s main || true

      - name: Apply Defconfig Tweaks
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          DEFCONFIG="$DEFCONFIG_INPUT"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "Specified defconfig ($DEFCONFIG) not directly found. Searching available configs..."
            if [ -f "arch/arm64/configs/lineage_oneplus5_defconfig" ]; then
              DEFCONFIG="lineage_oneplus5_defconfig"
            elif [ -f "arch/arm64/configs/lineageos_oneplus5_defconfig" ]; then
              DEFCONFIG="lineageos_oneplus5_defconfig"
            elif [ -f "arch/arm64/configs/oneplus5_defconfig" ]; then
              DEFCONFIG="oneplus5_defconfig"
            elif [ -f "arch/arm64/configs/dumpling_defconfig" ]; then
              DEFCONFIG="dumpling_defconfig"
            elif [ -f "arch/arm64/configs/cheeseburger_defconfig" ]; then
              DEFCONFIG="cheeseburger_defconfig"
            elif [ -f "arch/arm64/configs/msm8998_defconfig" ]; then
              DEFCONFIG="msm8998_defconfig"
            elif [ -f "arch/arm64/configs/msmcortex-perf_defconfig" ]; then
              DEFCONFIG="msmcortex-perf_defconfig"
            else
              DETECTED=$(find arch/arm64/configs -maxdepth 2 -type f \( -name "*oneplus5*" -o -name "*dumpling*" -o -name "*cheeseburger*" -o -name "*msm8998*" -o -name "*msmcortex*" \) | head -n 1)
              if [ -n "$DETECTED" ]; then
                DEFCONFIG=$(echo "$DETECTED" | sed 's|arch/arm64/configs/||')
              else
                echo "ERROR: No valid defconfig found in arch/arm64/configs!"
                ls -la arch/arm64/configs/
                exit 1
              fi
            fi
          fi

          TARGET_CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          echo "Selected defconfig: $DEFCONFIG ($TARGET_CONFIG_PATH)"
          echo "DEFCONFIG_NAME=$DEFCONFIG" >> $GITHUB_ENV

          # Append all custom tweaks from config file
          if [ -f "$GITHUB_WORKSPACE/config/custom_tweaks.config" ]; then
            echo "Applying custom tweaks from config/custom_tweaks.config..."
            cat "$GITHUB_WORKSPACE/config/custom_tweaks.config" >> "$TARGET_CONFIG_PATH"
          fi

          # Pure / Original Naming: Ensure clean LOCALVERSION
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' "$TARGET_CONFIG_PATH" || true
          echo 'CONFIG_LOCALVERSION=""' >> "$TARGET_CONFIG_PATH"

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="buildhost"

          echo "Generating defconfig ($DEFCONFIG_NAME)..."
          make O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG_NAME"

          echo "Compiling kernel..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            HOSTCFLAGS="-w -fcommon" \
            HOSTLDFLAGS="-w" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/anykernel"
          if [ -f "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" ]; then
            cp "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" "$GITHUB_WORKSPACE/anykernel/anykernel.sh"
          fi

      - name: Package with AnyKernel3
        run: |
          echo "=== Copying compiled kernel files to AnyKernel3 ==="
          KERNEL_OUT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          ls -la "$KERNEL_OUT" || true

          KERNEL_IMAGE=""
          # Copy Image.gz-dtb or Image.gz or Image
          if [ -f "$KERNEL_OUT/Image.gz-dtb" ]; then
            echo "Found Image.gz-dtb"
            KERNEL_IMAGE="$KERNEL_OUT/Image.gz-dtb"
            cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/anykernel/Image.gz-dtb"
          elif [ -f "$KERNEL_OUT/Image.gz" ]; then
            echo "Found Image.gz"
            KERNEL_IMAGE="$KERNEL_OUT/Image.gz"
            cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/anykernel/Image.gz"
          elif [ -f "$KERNEL_OUT/Image" ]; then
            echo "Found Image"
            KERNEL_IMAGE="$KERNEL_OUT/Image"
            cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/anykernel/Image"
          else
            echo "Searching recursively for kernel images..."
            KERNEL_IMAGE=$(find "$KERNEL_OUT" -type f -name "Image*" | head -n 1)
            if [ -n "$KERNEL_IMAGE" ]; then
              cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/anykernel/"
            fi
          fi

          # Copy dtb files if separate
          if [ -f "$KERNEL_OUT/dtb.img" ]; then
            cp "$KERNEL_OUT/dtb.img" "$GITHUB_WORKSPACE/anykernel/dtb.img"
          elif [ -f "$KERNEL_OUT/dtb" ]; then
            cp "$KERNEL_OUT/dtb" "$GITHUB_WORKSPACE/anykernel/dtb"
          fi

          # Generate standalone boot.img for direct fastboot flashing & inclusion in zip
          echo "=== Creating boot.img ==="
          mkdir -p "$GITHUB_WORKSPACE/ramdisk_dummy"
          touch "$GITHUB_WORKSPACE/ramdisk_dummy/.keep"
          (cd "$GITHUB_WORKSPACE/ramdisk_dummy" && find . | cpio -o -H newc | gzip -9 > "$GITHUB_WORKSPACE/empty_ramdisk.cpio.gz")

          CMDLINE="androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 service_locator.enable=1 earlycon=msm_hsl_uart,0x00c19000"

          if [ -n "$KERNEL_IMAGE" ] && [ -f "$KERNEL_IMAGE" ]; then
            echo "Using kernel image: $KERNEL_IMAGE"
            # Try native mkbootimg with -o
            if command -v mkbootimg &> /dev/null; then
              mkbootimg \
                --kernel "$KERNEL_IMAGE" \
                --ramdisk "$GITHUB_WORKSPACE/empty_ramdisk.cpio.gz" \
                --cmdline "$CMDLINE" \
                --base 0x00000000 \
                --pagesize 4096 \
                --kernel_offset 0x00008000 \
                --ramdisk_offset 0x02000000 \
                --tags_offset 0x01e00000 \
                -o "$GITHUB_WORKSPACE/anykernel/boot.img" || true
            fi

            # Fallback to python mkbootimg if needed
            if [ ! -f "$GITHUB_WORKSPACE/anykernel/boot.img" ]; then
              echo "Downloading python mkbootimg fallback..."
              python3 -m pip install --upgrade pip mkbootimg 2>/dev/null || true
              mkbootimg \
                --kernel "$KERNEL_IMAGE" \
                --ramdisk "$GITHUB_WORKSPACE/empty_ramdisk.cpio.gz" \
                --cmdline "$CMDLINE" \
                --base 0x00000000 \
                --pagesize 4096 \
                --kernel_offset 0x00008000 \
                --ramdisk_offset 0x02000000 \
                --tags_offset 0x01e00000 \
                -o "$GITHUB_WORKSPACE/anykernel/boot.img" || true
            fi

            if [ -f "$GITHUB_WORKSPACE/anykernel/boot.img" ]; then
              echo "boot.img successfully created!"
              cp "$GITHUB_WORKSPACE/anykernel/boot.img" "$GITHUB_WORKSPACE/boot.img"
              echo "BOOT_IMG_PATH=$GITHUB_WORKSPACE/boot.img" >> $GITHUB_ENV
            else
              echo "Warning: boot.img could not be created."
            fi
          fi

          # Verify AnyKernel3 content
          cd "$GITHUB_WORKSPACE/anykernel"
          ls -la

          # Zip package (will include boot.img along with AnyKernel3 dynamic installer)
          TIME_TAG="${{ env.BUILD_TIME }}"
          [ -z "$TIME_TAG" ] && TIME_TAG=$(date +'%Y%m%d_%H%M%S')
          ZIP_NAME="kernel-dumpling-${TIME_TAG}.zip"
          zip -r9 "$ZIP_NAME" . -x ".git/*" -x ".github/*" -x "README.md"
          
          echo "ZIP_PATH=$GITHUB_WORKSPACE/anykernel/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Successfully created $ZIP_NAME"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.BOOT_IMG_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.BUILD_TIME) }}
          name: "OnePlus 5/5T Kernel (dumpling/cheeseburger) - ${{ env.BUILD_TIME }}"
          body: |
            ## OnePlus 5/5T (MSM8998) Kernel Build
            - **Build Timestamp**: `${{ env.BUILD_TIME }}`
            - **Target Defconfig**: `${{ env.DEFCONFIG_NAME }}`
            - **Source Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Integrated Features**: KernelSU-Next, Meta OverlayFS, Performance Optimizations
            
            ### Included Files:
            - **`${{ env.ZIP_NAME }}`**: Flashable zip with AnyKernel3 dynamic installer + embedded `boot.img` (Flash via **TWRP / OrangeFox**).
            - **`boot.img`**: Standalone boot image (Flash via Fastboot: `fastboot flash boot boot.img`).
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.BOOT_IMG_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
