name: Build OnePlus 5T (dumpling) Kernel - KernelSU Next + SUSFS + Meta OverlayFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Git Repository URL'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_msm8998'
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'lineage-21'
      kernel_defconfig:
        description: 'Defconfig name'
        required: true
        default: 'dumpling_defconfig'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_oneplus_msm8998' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-21' }}
      DEFCONFIG_INPUT: ${{ github.event.inputs.kernel_defconfig || 'dumpling_defconfig' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Build Timestamp
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "DEVICE=dumpling" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            zip \
            curl \
            wget \
            python3 \
            libncurses5 \
            ccache \
            patch \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Proton Clang Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/toolchain/clang"

      - name: Clone Kernel Source
        run: |
          echo "Cloning $KERNEL_REPO ($KERNEL_BRANCH)..."
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

      - name: Integrate KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          echo "=== Integrating KernelSU-Next ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s main || true

      - name: Integrate SUSFS (susfs4ksu) & Meta OverlayFS Patches
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "=== Cloning SUSFS for 4.4 Kernel ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.4 "$GITHUB_WORKSPACE/susfs_src" || \
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs_src" || true

          if [ -d "$GITHUB_WORKSPACE/susfs_src" ]; then
            echo "Copying SUSFS files..."
            mkdir -p "$GITHUB_WORKSPACE/kernel/fs"
            mkdir -p "$GITHUB_WORKSPACE/kernel/include/linux"
            find "$GITHUB_WORKSPACE/susfs_src" -name "susfs.c" -exec cp {} "$GITHUB_WORKSPACE/kernel/fs/" \; || true
            find "$GITHUB_WORKSPACE/susfs_src" -name "susfs.h" -exec cp {} "$GITHUB_WORKSPACE/kernel/include/linux/" \; || true
            find "$GITHUB_WORKSPACE/susfs_src" -name "sus_su.h" -exec cp {} "$GITHUB_WORKSPACE/kernel/include/linux/" \; || true

            cd "$GITHUB_WORKSPACE/kernel"
            for p in $(find "$GITHUB_WORKSPACE/susfs_src" -name "*50_add_susfs_in_kernel*.patch" 2>/dev/null); do
              echo "Checking kernel patch: $p"
              patch -p1 -N --dry-run -s < "$p" 2>/dev/null && patch -p1 -N -s < "$p" || echo "Kernel patch skipped/already present."
            done

            KSU_DIR="$GITHUB_WORKSPACE/kernel/KernelSU"
            [ ! -d "$KSU_DIR" ] && KSU_DIR="$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
            if [ -d "$KSU_DIR" ]; then
              cd "$KSU_DIR"
              for p in $(find "$GITHUB_WORKSPACE/susfs_src" -name "*10_enable_susfs_for_ksu*.patch" 2>/dev/null); do
                echo "Checking KSU patch: $p"
                patch -p1 -N --dry-run -s < "$p" 2>/dev/null && patch -p1 -N -s < "$p" || echo "KSU patch skipped/already present."
              done
            fi
          fi

      - name: Apply Defconfig Tweaks
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          DEFCONFIG="$DEFCONFIG_INPUT"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            if [ -f "arch/arm64/configs/dumpling_defconfig" ]; then
              DEFCONFIG="dumpling_defconfig"
            elif [ -f "arch/arm64/configs/cheeseburger_defconfig" ]; then
              DEFCONFIG="cheeseburger_defconfig"
            elif [ -f "arch/arm64/configs/msm8998_defconfig" ]; then
              DEFCONFIG="msm8998_defconfig"
            fi
          fi

          TARGET_CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          echo "Selected defconfig: $DEFCONFIG"
          echo "DEFCONFIG_NAME=$DEFCONFIG" >> $GITHUB_ENV

          # Append all custom tweaks from config file
          if [ -f "$GITHUB_WORKSPACE/config/custom_tweaks.config" ]; then
            echo "Applying custom tweaks from config/custom_tweaks.config..."
            cat "$GITHUB_WORKSPACE/config/custom_tweaks.config" >> "$TARGET_CONFIG_PATH"
          fi

          # Pure / Original Naming: Ensure no custom string branding
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' "$TARGET_CONFIG_PATH" || true
          echo 'CONFIG_LOCALVERSION=""' >> "$TARGET_CONFIG_PATH"

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="buildhost"

          echo "Generating configuration using $DEFCONFIG_NAME..."
          make O=out ARCH=arm64 "$DEFCONFIG_NAME"

          echo "Compiling kernel..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/anykernel"
          if [ -f "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" ]; then
            cp "$GITHUB_WORKSPACE/anykernel_config/anykernel.sh" "$GITHUB_WORKSPACE/anykernel/anykernel.sh"
          fi

      - name: Package with AnyKernel3
        run: |
          KERNEL_OUT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          
          if [ -f "$KERNEL_OUT/Image.gz-dtb" ]; then
            cp "$KERNEL_OUT/Image.gz-dtb" "$GITHUB_WORKSPACE/anykernel/"
          elif [ -f "$KERNEL_OUT/Image.gz" ]; then
            cp "$KERNEL_OUT/Image.gz" "$GITHUB_WORKSPACE/anykernel/"
            if [ -f "$KERNEL_OUT/dtb.img" ]; then
              cp "$KERNEL_OUT/dtb.img" "$GITHUB_WORKSPACE/anykernel/"
            fi
          elif [ -f "$KERNEL_OUT/Image" ]; then
            cp "$KERNEL_OUT/Image" "$GITHUB_WORKSPACE/anykernel/"
          else
            echo "Error: Compiled kernel image not found in $KERNEL_OUT!"
            ls -la "$KERNEL_OUT" || true
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/anykernel"
          ZIP_NAME="kernel-dumpling-${BUILD_TIME}.zip"
          zip -r9 "$ZIP_NAME" * -x .git .github README.md *placeholder
          echo "ZIP_PATH=$GITHUB_WORKSPACE/anykernel/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
